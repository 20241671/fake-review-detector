<!DOCTYPE html>
<html>

<head>

  <title> 허위 리뷰 탐지기</title>

  <style>

    body {

  background: linear-gradient(
    to right,
    #dbeafe,
    #fce7f3
  );

  font-family: Arial;

  padding: 40px;

}


.container {

  background-color: white;

  max-width: 700px;

  margin: auto;

  padding: 35px;

  border-radius: 25px;

  box-shadow: 0px 10px 30px
  rgba(0,0,0,0.1);

}


h1 {

  text-align: center;

  color: #374151;

  margin-bottom: 30px;

}


textarea {

  width: 100%;

  height: 200px;

  padding: 0px;

  border-radius: 15px;

  border: 2px solid #d1d5db;

  font-size: 16px;

  resize: none;

}


button {

  width: 100%;

  margin-top: 20px;

  padding: 15px;

  border: none;

  border-radius: 15px;

  background-color: #60a5fa;

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  transition: 0.3s;

}


button:hover {

  background-color: #3b82f6;

}


#result {

  margin-top: 25px;

  padding: 20px;

  background-color: #f9fafb;

  border-radius: 15px;

  line-height: 1.8;

  border-left: 8px solid #60a5fa;

}

  </style>

</head>

<body>

  <div class="container">

    <h1> 허위 리뷰 탐지기</h1>

    <textarea
      id="review"
      placeholder="리뷰를 입력하세요"></textarea>

    <button onclick="checkReview()">

      분석하기

    </button>

    <div id="result">

      결과가 여기에 표시됩니다.

    </div>

  </div>

  <script>

    function checkReview() {

      let text =
      document.getElementById("review").value;

      let score = 0;

      let reasons = [];



      // 허위 리뷰 단어 데이터
      let fakeWords = [

        "강추",
        "무조건",
        "인생템",
        "꼭 사세요",
        "최고",
        "대박"

      ];



      // 실제 리뷰 단어 데이터
      let realWords = [

        "배송",
        "사용",
        "구매",
        "직접",
        "써봤",
        "재구매"

      ];



      // 허위 리뷰 단어 검사
      fakeWords.forEach(word => {

        if(text.includes(word)) {

          score++;

          reasons.push(

          "허위 리뷰 표현 발견: " + word

          );

        }

      });



      // 실제 리뷰 단어 검사
      realWords.forEach(word => {

        if(text.includes(word)) {

          score--;

          reasons.push(

          "실제 사용 경험 표현 발견: " + word

          );

        }

      });



      // 느낌표 검사
      if(text.includes("!!!")) {

        score++;

        reasons.push(

        "과도한 느낌표 사용"

        );

      }



      // 지나치게 긴 리뷰 검사
      if(text.length > 100) {

        score++;

        reasons.push(

        "리뷰 길이가 지나치게 김"

        );

      }



      // 경험 표현 부족 검사
      if(

      !text.includes("사용") &&
      !text.includes("배송") &&
      !text.includes("구매") &&
      !text.includes("직접")

      ) {

        score++;

        reasons.push(

        "구체적인 경험 표현 부족"

        );

      }



      // 퍼센트 계산
      let percent = score * 20;

      if(percent < 0) {

        percent = 0;

      }

      if(percent > 100) {

        percent = 100;

      }



      // 결과 출력
      let result = "";



      if(percent >= 60) {

        result =

        "⚠️ 허위 리뷰 가능성이 높습니다";

      }

      else if(percent >= 30) {

        result =

        "🟡 조작 가능성이 일부 존재합니다";

      }

      else {

        result =

        "✅ 일반 리뷰일 가능성이 높습니다";

      }



      document.getElementById("result").innerHTML =

      "<h2>" + result + "</h2>" +

      "<b>허위 가능성:</b> " +

      percent + "%" +

      "<br><br>" +

      "<b>탐지된 특징</b><br>" +

      reasons.join("<br>");

    }

  </script>

</body>

</html>
